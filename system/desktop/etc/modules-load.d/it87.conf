# Load the ITE IT8689E Super I/O driver at boot so the B650 Gaming X AX V2's
# motherboard fan headers (pwm1-5) appear in hwmon and CoolerControl. Without
# it only gigabyte_wmi loads, which exposes temperatures but no fans.
#
# Needs the out-of-tree driver from the AUR (yay -S it87-dkms-git). The in-tree
# one talks to the chip over I/O ports the BIOS also drives, so the BIOS kept
# taking the fans back and CPU_FAN never responded. The out-of-tree driver uses
# MMIO on Gigabyte boards and holds control.
it87
