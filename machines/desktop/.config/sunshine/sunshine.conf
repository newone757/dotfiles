# --- capture ---
# Sunshine captures ONLY the headless "sunshine" output that
# ~/.local/bin/sunshine-stream-begin creates per stream at the client's
# resolution, parked at 20000,0 away from the physical monitors. Physical
# monitors stay on and untouched; Big Picture and Proton games are routed to
# workspace "stream" on that output by window rules in ~/.config/hypr/windows.lua
# (enabled only while streaming). Desktop windows never reach the stream.
output_name = sunshine
encoder = nvenc
adapter_name = /dev/dri/renderD129
capture = wlr

# Portal capture (the 2026.916 default) fails on Hyprland: xdg-desktop-portal-hyprland
# exposes no org.freedesktop.portal.RemoteDesktop, which aborts startup before
# encoder probing. Keep capture pinned to wlr.

# --- stream defaults ---
min_log_level = info

# --- host display tweaks for the duration of a stream ---
# Bumps HDMI-A-2 to scale 1.5 (logical 2560x1440) so the 4K desktop is
# readable on a laptop-sized client, and restores scale 1 on disconnect.
# DISABLED: changing output geometry mid-stream-init stalls Sunshine ~54s.
# global_prep_cmd = [{"do":"/home/lonnie/.local/bin/sunshine-host-scale start","undo":"/home/lonnie/.local/bin/sunshine-host-scale stop"}]

# Virtual-display variant, for later:
# global_prep_cmd = [{"do":"/home/lonnie/.local/bin/sunshine-virtual-display start","undo":"/home/lonnie/.local/bin/sunshine-virtual-display stop"}]

# --- web ui ---
csrf_allowed_origins = https://10.0.1.22:47990,https://omarchy:47990,https://omarchy.local:47990

# --- stream lifecycle: inhibit idle-lock + wake captured output ---
# The Omarchy lock is a Quickshell session-lock surface with no unlock IPC, so a
# lock cannot be undone remotely - it can only be prevented. These bump the
# counter ~/.local/bin/screensaver-inhibited reads, which hypridle honours.
global_prep_cmd = [{"do":"/home/lonnie/.local/bin/sunshine-stream-begin","undo":"/home/lonnie/.local/bin/sunshine-stream-end"}]

