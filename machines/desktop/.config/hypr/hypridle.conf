general {
    lock_cmd = omarchy-system-lock
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true omarchy-system-lock
    after_sleep_cmd = sleep 3; hyprctl keyword monitor HDMI-A-2,disable; wakeonlan 00:a1:59:35:35:da; omarchy-system-wake; sleep 10; hyprctl keyword monitor "HDMI-A-2,3840x2160@120,0x0,1"
    inhibit_sleep = 3
    ignore_dbus_inhibit = true                             # screensaver-inhibit-watch owns org.freedesktop.ScreenSaver instead
}

# Screensaver after 2.5 min — skips if browser Video Wake Lock is active
listener {
    timeout = 150
    on-timeout = pidof hyprlock || screensaver-inhibited || omarchy-launch-screensaver
}

# Lock after screensaver — skips if Video Wake Lock is active
# Blanks the TV panel (turn_screen_off) rather than powering it off — TV stays
# fully powered so resume is instant (turn_screen_on), no WoL race condition.
# Uses OMARCHY_LOCK_ONLY=true to skip omarchy-system-lock's own background
# "dpms off" (ALL monitors, incl. HDMI-A-2) — that genuinely cuts the TV's
# HDMI signal, and since the TV stays fully powered now (not power_off'd),
# it reacts to the lost signal with a "No Signal" warning instead of just
# going quiet. DP-6 (secondary) is DPMS'd off explicitly instead, scoped.
# The `sleep 3` before turn_screen_off lets hyprlock finish spawning and
# configuring its lock surface on HDMI-A-2 first — sending turn_screen_off
# while hyprlock is still mid-setup appears to trigger an HDMI renegotiation
# that forces the TV back to "signal active", undoing the blank.
listener {
    timeout = 152
    on-timeout = screensaver-inhibited || (OMARCHY_LOCK_ONLY=true omarchy-system-lock && sleep 3 && timeout 10 /home/lonnie/.local/lgpowercontrol/bscpylgtv/bin/bscpylgtvcommand 10.0.1.28 turn_screen_off && hyprctl dispatch dpms off DP-6 && (timeout 7200 ~/.local/lgpowercontrol/wake-displays-on-activity.sh &))
    on-resume = omarchy-system-wake; ~/.local/lgpowercontrol/tv-on.sh
}

# Safety lock after 60 min — unconditional, catches "left PC with video playing"
# Real power-off here for actual power savings; tv-on.sh falls back to full
# WoL + HDMI handshake since the TV has genuinely lost power by this point.
listener {
    timeout = 3600
    on-timeout = OMARCHY_LOCK_ONLY=true omarchy-system-lock && sleep 3 && timeout 10 /home/lonnie/.local/lgpowercontrol/bscpylgtv/bin/bscpylgtvcommand 10.0.1.28 power_off && hyprctl dispatch dpms off DP-6 && (timeout 7200 ~/.local/lgpowercontrol/wake-displays-on-activity.sh &)
    on-resume = omarchy-system-wake; ~/.local/lgpowercontrol/tv-on.sh
}
