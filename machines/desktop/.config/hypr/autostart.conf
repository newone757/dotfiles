# Extra autostart processes
# exec-once = uwsm app -- my-service
exec-once = systemctl --user start trackpad-gestures.service

# Auto-tile first window per workspace
exec-once = ~/.local/bin/auto-tile

# ScreenSaver inhibit tracker — owns org.freedesktop.ScreenSaver, tracks browser Video Wake Lock
exec-once = python3 ~/.local/bin/screensaver-inhibit-watch
